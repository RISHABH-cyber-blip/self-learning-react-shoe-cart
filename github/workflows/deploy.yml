
name: Deploy E-commerce Product

on:
  push:
    branches:
      - main
    paths:
      - 'ecom-product/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ecom-product/package-lock.json

      - name: Install dependencies
        working-directory: ecom-product
        run: npm ci

      - name: Build React application
        working-directory: ecom-product
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ecom-product/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
